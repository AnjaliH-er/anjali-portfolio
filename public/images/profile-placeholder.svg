<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="meshCenter" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" />
  <rect width="500" height="500" rx="36" fill="url(#meshCenter)" />
  <rect width="496" height="496" x="2" y="2" rx="34" fill="none" stroke="url(#avatarGlow)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Geometric Grid & Circuit Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5">
    <circle cx="250" cy="220" r="160" fill="none" stroke-dasharray="6 6" />
    <circle cx="250" cy="220" r="120" fill="none" />
    <line x1="250" y1="20" x2="250" y2="70" />
    <line x1="50" y1="220" x2="90" y2="220" />
    <line x1="410" y1="220" x2="450" y2="220" />
  </g>

  <!-- Central Silhouette & Tech Monogram -->
  <circle cx="250" cy="180" r="68" fill="#1e293b" stroke="url(#avatarGlow)" stroke-width="3" />
  <path d="M140 400 C140 310, 200 270, 250 270 C300 270, 360 310, 360 400 Z" fill="#1e293b" stroke="url(#avatarGlow)" stroke-width="3" />

  <!-- Initials Badge -->
  <text x="250" y="196" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#avatarGlow)" text-anchor="middle" letter-spacing="1">AH</text>
  
  <!-- Code Brackets Decors -->
  <text x="110" y="170" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#38bdf8" fill-opacity="0.5">&lt;/&gt;</text>
  <text x="360" y="280" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#c084fc" fill-opacity="0.5">&#123;...&#125;</text>

  <!-- Status Chip -->
  <g transform="translate(145, 424)">
    <rect width="210" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="42" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Anjali Hiremath</text>
  </g>
</svg>
