<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Window Header -->
  <rect width="800" height="44" fill="#0f172a" />
  <circle cx="28" cy="22" r="6" fill="#ef4444" />
  <circle cx="48" cy="22" r="6" fill="#f59e0b" />
  <circle cx="68" cy="22" r="6" fill="#10b981" />
  <text x="400" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" text-anchor="middle">CyberShield AI — ML Text & Threat Classifier</text>

  <!-- Left Panel: Text Input & Processing -->
  <g transform="translate(40, 70)">
    <rect width="440" height="390" rx="10" fill="#0b1120" stroke="#1e293b" />
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Message / Log Inspection Box</text>
    
    <!-- Code / Text Area -->
    <rect x="24" y="56" width="392" height="230" rx="8" fill="#030712" stroke="#1e293b" />
    <text x="40" y="90" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">&gt; Input Content Sample:</text>
    <text x="40" y="118" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">"URGENT: Your account credentials have expired.</text>
    <text x="40" y="138" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Click link below immediately to verify identity</text>
    <text x="40" y="158" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">or services will be suspended within 24 hours."</text>
    <text x="40" y="200" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc">Tokens detected: 28 | Phishing keywords: 4</text>

    <!-- Run Classification Button -->
    <rect x="24" y="310" width="392" height="48" rx="8" fill="url(#shieldGrad)" />
    <text x="220" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Analyze with ML Model</text>
  </g>

  <!-- Right Panel: Threat Scoring -->
  <g transform="translate(506, 70)">
    <rect width="254" height="390" rx="10" fill="#0b1120" stroke="#1e293b" />
    <text x="20" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Classification Result</text>

    <!-- Verdict Card -->
    <rect x="20" y="56" width="214" height="110" rx="8" fill="#450a0a" stroke="#dc2626" />
    <text x="127" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">THREAT DETECTED</text>
    <text x="127" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ef4444" text-anchor="middle">Suspicious / Phish</text>

    <!-- Confidence Gauge -->
    <rect x="20" y="184" width="214" height="180" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="32" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Model Confidence</text>
    <text x="32" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#38bdf8">94.2%</text>

    <!-- Progress bar -->
    <rect x="32" y="260" width="190" height="8" rx="4" fill="#1e293b" />
    <rect x="32" y="260" width="178" height="8" rx="4" fill="#38bdf8" />

    <text x="32" y="300" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Classifier: Naive Bayes / SVM</text>
    <text x="32" y="324" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Vector: TF-IDF n-grams</text>
    <text x="32" y="348" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Status: Processed in 12ms</text>
  </g>
</svg>
