<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Window Header -->
  <rect width="800" height="44" fill="#1e293b" />
  <circle cx="28" cy="22" r="6" fill="#ef4444" />
  <circle cx="48" cy="22" r="6" fill="#f59e0b" />
  <circle cx="68" cy="22" r="6" fill="#10b981" />
  <text x="400" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Blinkit Grocery Sales Analytics Dashboard — Power BI Model</text>

  <!-- Top KPI Cards -->
  <g transform="translate(30, 60)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="170" height="85" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">TOTAL SALES</text>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#facc15">$1.20M</text>
    <text x="16" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#10b981">▲ 8.6% vs Target</text>

    <!-- KPI 2 -->
    <rect x="190" y="0" width="170" height="85" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="206" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">AVG RATING</text>
    <text x="206" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#38bdf8">3.9 / 5.0</text>
    <text x="206" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">8,523 Customer Ratings</text>

    <!-- KPI 3 -->
    <rect x="380" y="0" width="170" height="85" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="396" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">ITEMS SOLD</text>
    <text x="396" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#a855f7">8,523</text>
    <text x="396" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#38bdf8">Across 16 Categories</text>

    <!-- KPI 4 -->
    <rect x="570" y="0" width="170" height="85" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="586" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">AVG SALE / ITEM</text>
    <text x="586" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#34d399">$140.99</text>
    <text x="586" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#10b981">Healthy Distribution</text>
  </g>

  <!-- Middle Charts Section -->
  <g transform="translate(30, 165)">
    <!-- Chart 1: Bar Chart (Outlet Size vs Sales) -->
    <rect x="0" y="0" width="460" height="180" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Sales by Item Category</text>
    
    <!-- Bar 1 -->
    <text x="18" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Fruits &amp; Veg</text>
    <rect x="110" y="48" width="310" height="16" rx="3" fill="#facc15" />
    <text x="430" y="61" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">$178K</text>

    <!-- Bar 2 -->
    <text x="18" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Snacks / Foods</text>
    <rect x="110" y="78" width="280" height="16" rx="3" fill="#38bdf8" />
    <text x="400" y="91" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">$172K</text>

    <!-- Bar 3 -->
    <text x="18" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Household</text>
    <rect x="110" y="108" width="220" height="16" rx="3" fill="#818cf8" />
    <text x="340" y="121" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">$145K</text>

    <!-- Bar 4 -->
    <text x="18" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Dairy / Frozen</text>
    <rect x="110" y="138" width="190" height="16" rx="3" fill="#a855f7" />
    <text x="310" y="151" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">$132K</text>

    <!-- Chart 2: Donut / Distribution -->
    <rect x="480" y="0" width="260" height="180" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="498" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Outlet Location Tier</text>

    <!-- Donut Simulation -->
    <circle cx="610" cy="105" r="50" fill="none" stroke="#334155" stroke-width="20" />
    <circle cx="610" cy="105" r="50" fill="none" stroke="#facc15" stroke-width="20" stroke-dasharray="120 200" />
    <circle cx="610" cy="105" r="50" fill="none" stroke="#38bdf8" stroke-width="20" stroke-dasharray="80 240" stroke-dashoffset="-120" />
    <circle cx="610" cy="105" r="50" fill="none" stroke="#818cf8" stroke-width="20" stroke-dasharray="70 250" stroke-dashoffset="-200" />
    
    <text x="610" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3 Tiers</text>
  </g>

  <!-- Bottom Filter Bar -->
  <g transform="translate(30, 360)">
    <rect x="0" y="0" width="740" height="85" rx="8" fill="#0b1120" stroke="#334155" />
    <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">ACTIVE FILTER SLICERS</text>
    
    <rect x="20" y="38" width="130" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" />
    <text x="85" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Outlet: Tier 1 &amp; 2</text>

    <rect x="160" y="38" width="130" height="32" rx="6" fill="#1e293b" />
    <text x="225" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Fat: Low Fat &amp; Reg</text>

    <rect x="300" y="38" width="130" height="32" rx="6" fill="#1e293b" />
    <text x="365" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Type: Supermarket</text>

    <text x="710" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981" text-anchor="end">DAX Measures Active</text>
  </g>
</svg>
